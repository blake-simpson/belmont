name: ci

on:
  push:
    branches: [main, v1-rebuild]
  pull_request:
    branches: [main, v1-rebuild]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (includes dep-cruiser boundary check)
        run: pnpm build

      - name: Test (vitest + pi-boundary)
        run: pnpm test
